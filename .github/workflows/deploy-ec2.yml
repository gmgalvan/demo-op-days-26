name: deploy-ec2

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "HolaMicroservicio/**"
      - ".github/workflows/deploy-ec2.yml"

env:
  APP_DIR: /opt/hola-microservicio
  SERVICE_NAME: hola-microservicio.service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app
        run: dotnet publish HolaMicroservicio/HolaMicroservicio.csproj --configuration Release --output ./publish

      - name: Pack artifact
        run: tar -czf app.tar.gz -C ./publish .

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 to known hosts
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy package to EC2
        run: scp app.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/app.tar.gz

      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            sudo mkdir -p ${APP_DIR} &&
            sudo tar -xzf /tmp/app.tar.gz -C ${APP_DIR} &&
            sudo chown -R hola-microservicio:hola-microservicio ${APP_DIR} &&
            sudo systemctl restart ${SERVICE_NAME} &&
            sudo systemctl status ${SERVICE_NAME} --no-pager
          "
